[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "totvs-protheus"
version = "0.1.1"
description = "Typed Python client for the TOTVS Protheus REST APIs, generated from the official TTALK OpenAPI specs."
readme = "docs/PROTHEUS-CLIENT.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Dionisio Chiuratto Agourakis", email = "dionisio@getjai.com" }]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
]

[project.optional-dependencies]
arrow = ["pyarrow>=15"]  # plus the ttalk_fast wheel built from crates/ttalk-fast-py (not on PyPI)
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "datamodel-code-generator>=0.30",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/protheus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:protheus"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/protheus/models", "src/protheus/apis"]
