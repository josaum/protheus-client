[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ttalk-fast"
version = "0.1.0"
description = "TOTVS TTALK spec engine and Arrow page decoder (Rust, PyO3)."
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ttalk_fast"
