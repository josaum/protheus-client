[workspace]
resolver = "2"
members = ["crates/ttalk-fast-core", "crates/ttalk-fast-cli", "crates/ttalk-fast-py", "crates/ttalk-fast-node"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Dionisio Chiuratto Agourakis <dionisio@getjai.com>"]
repository = "https://github.com/josaum/protheus-client"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"
thiserror = "2"
jsonschema = { version = "0.53", default-features = false }
arrow-array = "=58.3.0"
arrow-schema = "=58.3.0"
arrow-json = "=58.3.0"
arrow-ipc = "=58.3.0"
arrow-select = "=58.3.0"
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py38"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
