name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  native-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: macos-14, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --locked -m crates/ttalk-fast-py/Cargo.toml --out dist
      - name: Install and smoke-test the wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links=dist ttalk-fast
          python - <<'PY'
          import json
          import ttalk_fast

          bundle = json.dumps({"components": {"schemas": {
              "Row": {"type": "object", "properties": {"code": {"type": "string"}}},
              "Page": {"type": "object", "properties": {"items": {
                  "type": "array", "items": {"$ref": "#/components/schemas/Row"}
              }}},
          }}})
          decoder = ttalk_fast.Decoder(bundle, "Page")
          ipc, report = decoder.decode(b'{"items":[{"code":"ok"}]}')
          assert ipc and json.loads(report)["rows"] == 1
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  native-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, platform: linux-x64-gnu }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64-gnu }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: macos-14, platform: darwin-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: ./build-node.sh
      - run: npm test
        working-directory: crates/ttalk-fast-node
      - run: cargo build --release --locked -p ttalk-fast-cli
      - name: Package Node addon and CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          version=$(node -p "require('./crates/ttalk-fast-node/package.json').version")
          pushd crates/ttalk-fast-node
          package=$(npm pack --silent)
          popd
          mv "crates/ttalk-fast-node/$package" "artifacts/ttalk-fast-node-$version-${{ matrix.platform }}.tgz"
          tar -C target/release -czf "artifacts/ttalk-fast-cli-$version-${{ matrix.platform }}.tar.gz" ttalk-fast
      - uses: actions/upload-artifact@v4
        with:
          name: native-packages-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  assemble:
    needs: [python-package, native-wheels, native-packages]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts
          merge-multiple: true
      - name: Generate CycloneDX SBOMs
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --manifest-path crates/ttalk-fast-core/Cargo.toml -f json --describe crate --no-build-deps
          cargo cyclonedx --manifest-path crates/ttalk-fast-node/Cargo.toml -f json --describe crate --no-build-deps
          cargo cyclonedx --manifest-path crates/ttalk-fast-cli/Cargo.toml -f json --describe crate --no-build-deps
          mkdir -p sboms
          cp crates/ttalk-fast-core/ttalk-fast-core.cdx.json sboms/
          cp crates/ttalk-fast-node/ttalk-fast-node.cdx.json sboms/
          cp crates/ttalk-fast-cli/ttalk-fast-cli.cdx.json sboms/
          python scripts/package_sbom.py --output sboms/totvs-protheus.cdx.json --source-commit "$GITHUB_SHA"
      - name: Embed native SBOMs and stamp release provenance
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/inject_sbom.py --dist artifacts --sbom sboms/ttalk-fast-core.cdx.json
          cp sboms/*.json artifacts/
          python scripts/release_manifest.py --artifacts artifacts --sbom-dir sboms --source-commit "$GITHUB_SHA" --source-repository "$SOURCE_REPOSITORY"
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          root = Path("artifacts")
          files = sorted(path for path in root.rglob("*") if path.is_file())
          lines = [f"{sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root)}" for path in files]
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          PY
          python scripts/verify_release.py --artifacts artifacts --sbom-dir sboms
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error
      - name: Attach artifacts to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
